<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Student Profile Card Using React Components — Practical 6" />
  <title>ScholarProfile — Student Profile Directory (React)</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <link rel="stylesheet" href="css/student.css" />

  <!-- React 18 Production UMD + Babel for in-browser JSX parsing -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- Root React DOM Container -->
  <div id="root"></div>

  <!-- Load React Components with Babel JSX Transpiler -->
  <script type="text/babel" src="js/components/StatsBar.jsx"></script>
  <script type="text/babel" src="js/components/StudentCard.jsx"></script>
  <script type="text/babel" src="js/components/StudentModal.jsx"></script>
  <script type="text/babel" src="js/App.jsx"></script>

  <!-- Mount Component -->
  <script type="text/babel">
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
